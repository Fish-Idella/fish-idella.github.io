<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Live2D SampleApp1</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=1.0, maximum-scale=4.0">
    <style>
        body, #fullscreen-canvas, #glcanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #modelSelect {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #888;
            background: rgba(255,255,255,0.9);
            max-width: 60%;
        }
        #myconsole {
            position: absolute;
            left: 10px;
            bottom: 10px;
            z-index: 10;
            color: #ffffff;
            font: 12px/1.4 monospace;
            text-shadow: 0 0 3px #000;
            max-width: 60%;
            pointer-events: none;
        }
    </style>
</head>

<body onload="sampleApp1()">
    <div id="fullscreen-canvas">
        <canvas id="glcanvas"></canvas>
    </div>

    <select id="modelSelect"></select>
    <div id="myconsole">---- Log ----</div>

    <!-- Live2D Library -->
    <script src="lib/live2d.min.js"></script>

    <!-- Live2D Framework -->
    <script src="framework/Live2DFramework.js"></script>

    <!-- User's Script -->
    <script src="utils/MatrixStack.js"></script>
    <script src="utils/ModelSettingJson.js"></script>
    <script src="src/PlatformManager.js"></script>
    <!-- 模型清单（由 tools/gen-model-list.js 生成，须在 LAppDefine.js 之前加载） -->
    <script src="model-list.js"></script>
    <script src="src/LAppDefine.js"></script>
    <script src="src/LAppModel.js"></script>
    <script src="src/LAppLive2DManager.js"></script>
    <script src="src/SampleApp1.js"></script>

</body>

</html>
