<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <!-- <base href="file:///var/mobile/Containers/Data/Application/57044C80-65C0-49D9-9B8F-347FE5C0BC6C/Documents/删除CSS无用表单/index.html"> -->
		<meta name="format-detection" content="telephone=no" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
		<title attr="html:title"></title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="inputCSS">
			<div id="title" attr="html:title"></div>
			<div id="select">
				<li>
					<div class="logo">CSS</div>
					<div class="title" attr="html:c_css"></div>
					<div class="zhushi" attr="html:z_css"></div>
					<input type="button" title="css" attr="value:select" />
				</li>
				<li>
					<div class="logo">HTML</div>
					<div class="title" attr="html:c_html"></div>
					<div class="zhushi" attr="html:z_html"></div>
					<input type="button" title="html" attr="value:select" />
				</li>
				<li>
					<div class="logo">E:</div>
					<div class="title" attr="html:c_select"></div>
					<div class="zhushi" attr="html:z_e"></div>
					<input type="button" title="select" attr="value:select" />
				</li>
				<li>
					<input type="checkbox" id="check1" checked>
					<label for="check1" attr="html:l1"></label>
					<input type="checkbox" id="check2">
					<label for="check2" attr="html:l2"></label>
				</li>
				<li>
					<input id="_ok" type="button" attr="value:ok">
				</li>
			</div>
			<div id="body">
				<textarea id="text" attr="placeholder:url"></textarea>
				<li>
					<input id="ok" type="button" attr="value:ok" disabled />
					<label id="file" for="_file" attr="html:s_File" ></label>
					<input type="file" id="_file" accept="text/html,text/css,text/javascript,application/javascript" />
				</li>
			</div>
		</div>
		<div id="error" style="display:none;"></div>
		<div id="newwindow" style="display:none;">
			<script src="script.js"></script>
		</div>
	</body>

</html>
