<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>别踩白块 · 频谱音游</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── 难度滑块 ── */
    .settings {
      width: min(340px, 86vw);
      margin: 14px auto 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(140, 190, 255, 0.10);
    }

    .setting-row {
      display: grid;
      grid-template-columns: 76px 1fr 44px;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      font-size: 12px;
      color: rgba(200, 220, 240, 0.72);
    }

    .setting-row+.setting-row {
      border-top: 1px dashed rgba(140, 190, 255, 0.08);
    }

    .setting-row label {
      text-align: left;
      letter-spacing: 0.4px;
    }

    .setting-row .val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #67e8f9;
      font-weight: 700;
    }

    .setting-row input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #67e8f9, #a78bfa);
      outline: none;
      touch-action: manipulation !important;
      cursor: pointer;
    }

    .setting-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #67e8f9;
      box-shadow: 0 0 8px rgba(103, 232, 249, 0.6);
      cursor: pointer;
    }

    .setting-row input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #67e8f9;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="menu" class="overlay">
      <h1>别踩白块</h1>
      <p class="sub">Web Audio · 频谱音游</p>
      <button id="btnStart" class="btn primary">开 始 游 戏</button>
      <button id="btnLocal" class="btn local">🎵 选择本地音频</button>
      <p class="hint">
        方块 <b>中间横线</b> 对准底部亮线时击打<br>
        键盘 <b>D F J K</b> ／ 点击对应轨道
      </p>

      <div class="settings">
        <div class="setting-row">
          <label>速度（快⇄慢）</label>
          <input type="range" id="sldTravel" min="0.50" max="1.40" step="0.05" value="0.90">
          <span class="val" id="valTravel">0.90</span>
        </div>
        <div class="setting-row">
          <label>判定（严⇄松）</label>
          <input type="range" id="sldJudge" min="0.10" max="0.40" step="0.01" value="0.25">
          <span class="val" id="valJudge">0.25</span>
        </div>
        <div class="setting-row">
          <label>谱面（稀⇄密）</label>
          <input type="range" id="sldDensity" min="0" max="100" step="1" value="50">
          <span class="val" id="valDensity">50</span>
        </div>
      </div>

      <p class="hint" style="margin-top:8px;font-size:11px;opacity:0.6">
        低频走外圈 · 高频走内圈 · 中频轮询
      </p>

      <div class="tierLegend">
        <span class="tier-perfect">PERFECT</span>
        <span class="tier-great">GREAT</span>
        <span class="tier-good">GOOD</span>
        <span class="tier-ok">OK</span>
      </div>
    </div>

    <div id="loading" class="overlay hidden">
      <div class="spinner"></div>
      <h3 id="loadTitle">正在分析音频节拍…</h3>
      <div class="bar"><i></i></div>
      <p class="tips" id="loadTip">节拍识别需要几秒钟，请稍候</p>
    </div>
    <div id="over" class="overlay hidden">
      <h2 id="resultTitle">GAME OVER</h2>
      <p class="sub" id="resultSub">TRACK FAILED</p>
      <div class="stats">
        <div class="stat"><span class="v final-score">0</span><span class="k">SCORE</span></div>
        <div class="stat"><span class="v final-combo">0</span><span class="k">MAX COMBO</span></div>
        <div class="stat"><span class="v gold final-best">0</span><span class="k">BEST</span></div>
      </div>
      <div class="tierStats">
        <span style="color:#67e8f9">P <b class="final-p">0</b></span>
        <span style="color:#a78bfa">G <b class="final-g">0</b></span>
        <span style="color:#fbbf24">Gd <b class="final-gd">0</b></span>
        <span style="color:#f472b6">OK <b class="final-ok">0</b></span>
      </div>
      <div class="newRecord hidden" id="newRecord">★ NEW RECORD ★</div>
      <button id="btnRetry" class="btn primary">再 来 一 局</button>
      <button id="btnMenu" class="btn">返回菜单</button>
      <p class="hint" id="retryHint" style="margin-top:2px">同一首曲子重开</p>
    </div>
    <div id="toast"></div>
    <input id="fileInput" type="file" accept="audio/*" hidden>
  </div>

  <script>
    /* ── 移动端长按防护 ── */
    (function guardTouch() {
      const style = document.createElement('style');
      style.textContent =
        'html,body,#app{' +
        '-webkit-touch-callout:none!important;' +
        '-webkit-user-select:none!important;' +
        '-moz-user-select:none!important;' +
        '-ms-user-select:none!important;' +
        'user-select:none!important;' +
        '-webkit-tap-highlight-color:transparent!important;' +
        '}' +
        'canvas{' +
        '-webkit-touch-callout:none!important;' +
        '-webkit-user-select:none!important;' +
        'user-select:none!important;' +
        '-webkit-tap-highlight-color:transparent!important;' +
        'touch-action:none!important;' +
        '}';
      document.head.appendChild(style);

      const blockMenu = (e) => { e.preventDefault(); return false; };
      document.addEventListener('contextmenu', blockMenu, { passive: false });
      window.addEventListener('contextmenu', blockMenu, { passive: false });

      const blockGesture = (e) => e.preventDefault();
      document.addEventListener('gesturestart', blockGesture, { passive: false });
      document.addEventListener('gesturechange', blockGesture, { passive: false });
      document.addEventListener('gestureend', blockGesture, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd < 320) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
  <script src="script.js"></script>
</body>

</html>
