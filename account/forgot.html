<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>找回密码 · Go Web Server</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="page-center">
    <div class="brand">
      <div class="brand__mark">G</div>
      <div>
        <div class="brand__name">Go Web Server</div>
        <div class="brand__sub">Account Center</div>
      </div>
    </div>

    <div class="card">
      <div class="card__head">
        <h1 class="card__title">重置密码</h1>
        <p class="card__desc" id="stepDesc">填写两项账号信息以验证身份</p>
      </div>

      <div class="alert alert--info is-show" id="notice">
        <span class="alert__icon">&#9432;</span>
        <span>请提供 <b>用户名、邮箱、手机号</b> 中的任意两项，且两项需属于同一账号。重置成功后所有设备需重新登录。</span>
      </div>

      <div class="alert alert--error" id="alert" role="alert" aria-live="polite"></div>

      <!-- 步骤一：三选二验证 -->
      <form class="form" id="verifyForm" novalidate>
        <div class="field">
          <label class="field__label" for="username">用户名</label>
          <input class="input" id="username" type="text"
                 autocomplete="username" placeholder="与注册时一致">
        </div>

        <div class="field">
          <label class="field__label" for="email">邮箱</label>
          <input class="input" id="email" type="email"
                 autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label class="field__label" for="phone">手机号</label>
          <input class="input" id="phone" type="tel"
                 autocomplete="tel" placeholder="纯数字">
        </div>

        <div class="field__hint" id="fillHint">已填写 <b>0</b> / 2 项</div>

        <button class="btn btn--block" type="submit" id="verifyBtn">
          <span class="btn__spinner"></span>
          <span>下一步</span>
        </button>
      </form>

      <!-- 步骤二：设置新密码 -->
      <form class="form hidden" id="pwdForm" novalidate>
        <div class="field">
          <label class="field__label" for="newPwd">新密码<span class="req">*</span></label>
          <div class="input-group">
            <input class="input" id="newPwd" type="password" autocomplete="new-password"
                   placeholder="6~72 位" required>
            <button class="input-group__btn" type="button" data-toggle-pwd="newPwd">显示</button>
          </div>
          <div class="strength" id="strength" data-level="0">
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
          </div>
          <div class="strength__text" id="strengthText">建议混合字母、数字与符号</div>
        </div>

        <div class="field">
          <label class="field__label" for="confirmPwd">确认新密码<span class="req">*</span></label>
          <div class="input-group">
            <input class="input" id="confirmPwd" type="password" autocomplete="new-password"
                   placeholder="再次输入新密码" required>
            <button class="input-group__btn" type="button" data-toggle-pwd="confirmPwd">显示</button>
          </div>
        </div>

        <button class="btn btn--block" type="submit" id="resetBtn">
          <span class="btn__spinner"></span>
          <span>重置密码</span>
        </button>

        <button class="btn btn--ghost btn--block" type="button" id="backBtn">返回上一步</button>
      </form>

      <!-- 完成 -->
      <div class="hidden" id="donePanel">
        <div class="alert alert--success is-show">
          <span class="alert__icon">&#10003;</span>
          <span id="doneText">密码已重置，请使用新密码登录。</span>
        </div>
        <a class="btn btn--block mt-16" href="login.html">前往登录</a>
      </div>

      <div class="card__foot" id="footTip">
        想起密码了？<a href="login.html">返回登录</a>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
  (function () {
    'use strict';

    var App = window.App;
    var $ = function (id) { return document.getElementById(id); };

    var alertEl   = $('alert');
    var noticeEl  = $('notice');
    var stepDesc  = $('stepDesc');
    var footTip   = $('footTip');

    var verifyForm = $('verifyForm');
    var pwdForm    = $('pwdForm');
    var donePanel  = $('donePanel');

    var verifyBtn = $('verifyBtn');
    var resetBtn  = $('resetBtn');
    var backBtn   = $('backBtn');

    var usernameEl = $('username');
    var emailEl    = $('email');
    var phoneEl    = $('phone');
    var fillHint   = $('fillHint');
    var newPwdEl   = $('newPwd');
    var confirmEl  = $('confirmPwd');
    var strengthEl = $('strength');
    var strengthTx = $('strengthText');

    /* 已通过校验的组合，第二步提交时复用 */
    var verified = null;

    App.redirectIfLoggedIn();

    /* 密码显示切换 */
    document.querySelectorAll('[data-toggle-pwd]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.getAttribute('data-toggle-pwd'));
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.textContent = show ? '隐藏' : '显示';
      });
    });

    /* 输入清错 */
    [usernameEl, emailEl, phoneEl, newPwdEl, confirmEl].forEach(function (el) {
      el.addEventListener('input', function () {
        App.ui.hideAlert(alertEl);
        el.removeAttribute('aria-invalid');
      });
    });

    /* 已填项计数 */
    function countFilled() {
      var n = 0;
      if (usernameEl.value.trim()) n++;
      if (emailEl.value.trim())    n++;
      if (phoneEl.value.trim())    n++;
      return n;
    }
    [usernameEl, emailEl, phoneEl].forEach(function (el) {
      el.addEventListener('input', function () {
        var n = countFilled();
        fillHint.innerHTML = '已填写 <b>' + n + '</b> / 2 项';
      });
    });

    /* 密码强度 */
    var STRENGTH_TEXT = ['建议混合字母、数字与符号', '强度：弱', '强度：一般', '强度：较强', '强度：很强'];
    newPwdEl.addEventListener('input', function () {
      var lv = App.validate.strength(newPwdEl.value);
      strengthEl.setAttribute('data-level', String(lv));
      strengthTx.textContent = STRENGTH_TEXT[lv];
    });

    function showStep(n) {
      verifyForm.classList.toggle('hidden', n !== 1);
      pwdForm.classList.toggle('hidden', n !== 2);
      donePanel.classList.toggle('hidden', n !== 3);
      footTip.classList.toggle('hidden', n === 3);
      noticeEl.classList.toggle('is-show', n === 1);
      App.ui.hideAlert(alertEl);

      if (n === 1) { stepDesc.textContent = '填写两项账号信息以验证身份'; usernameEl.focus(); }
      if (n === 2) { stepDesc.textContent = '设置新密码'; newPwdEl.focus(); }
      if (n === 3) { stepDesc.textContent = '完成'; }
    }

    /* 步骤一：收集两项，前端先做格式校验 */
    verifyForm.addEventListener('submit', function (e) {
      e.preventDefault();
      App.ui.hideAlert(alertEl);

      var u = usernameEl.value.trim();
      var m = emailEl.value.trim();
      var p = phoneEl.value.trim();

      if (countFilled() < 2) {
        App.ui.showAlert(alertEl, 'error', '请至少填写两项：用户名 / 邮箱 / 手机号');
        return;
      }

      if (u) {
        var e1 = App.validate.username(u);
        if (e1) { fail(usernameEl, e1); return; }
      }
      if (m) {
        var e2 = App.validate.email(m);
        if (e2) { fail(emailEl, e2); return; }
      }
      if (p) {
        var e3 = App.validate.phone(p);
        if (e3) { fail(phoneEl, e3); return; }
      }

      verified = { username: u, email: m, phone: p };

      /* 前端不校验"两项是否匹配"，交由后端统一判定；
         这里直接进入第二步，重置时一起提交。 */
      App.ui.showAlert(alertEl, 'success', '信息已记录，请设置新密码');
      showStep(2);
    });

    backBtn.addEventListener('click', function () { showStep(1); });

    /* 步骤二：提交重置 */
    pwdForm.addEventListener('submit', function (e) {
      e.preventDefault();
      App.ui.hideAlert(alertEl);

      var p1 = newPwdEl.value;
      var p2 = confirmEl.value;

      var err = App.validate.password(p1);
      if (err) { fail(newPwdEl, err); return; }

      if (p1 !== p2) { fail(confirmEl, '两次输入的密码不一致'); return; }

      if (!verified) {
        App.ui.showAlert(alertEl, 'error', '请先完成上一步验证');
        showStep(1);
        return;
      }

      App.ui.setLoading(resetBtn, true);
      App.request('/api/account/reset-password', {
        method: 'POST',
        auth: false,
        silent401: true,
        body: {
          username: verified.username,
          email:    verified.email,
          phone:    verified.phone,
          new_password: p1
        }
      }).then(function (r) {
        App.ui.setLoading(resetBtn, false);

        if (r.code === App.CODE.OK) {
          App.auth.clear();
          $('doneText').textContent = r.message || '密码已重置，请使用新密码登录。';
          showStep(3);
          return;
        }

        var msg = r.message || '重置失败，请稍后重试';
        if (r.code === App.CODE.CREDENTIAL_BAD) msg = '账号信息不匹配，无法验证身份';
        else if (r.code === App.CODE.INVALID_PARAM) msg = msg || '请求参数有误';

        App.ui.showAlert(alertEl, 'error', msg);
        /* 身份不匹配 → 退回第一步重新填写 */
        if (r.code === App.CODE.CREDENTIAL_BAD) {
          setTimeout(function () { showStep(1); }, 1200);
        }
      });
    });

    function fail(el, msg) {
      App.ui.showAlert(alertEl, 'error', msg);
      el.setAttribute('aria-invalid', 'true');
      el.focus();
    }
  })();
  </script>
</body>
</html>
