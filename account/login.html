<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>登录 · Go Web Server</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="page-center">
    <div class="brand">
      <div class="brand__mark">G</div>
      <div>
        <div class="brand__name">Go Web Server</div>
        <div class="brand__sub">Account Center</div>
      </div>
    </div>

    <div class="card">
      <div class="card__head">
        <h1 class="card__title">欢迎回来</h1>
        <p class="card__desc">使用用户名、邮箱或手机号登录</p>
      </div>

      <div class="alert alert--error" id="alert" role="alert" aria-live="polite"></div>

      <form class="form" id="loginForm" novalidate>
        <div class="field">
          <label class="field__label" for="account">账号<span class="req">*</span></label>
          <input class="input" id="account" name="account" type="text"
                 autocomplete="username" placeholder="用户名 / 邮箱 / 手机号"
                 required autofocus>
        </div>

        <div class="field">
          <label class="field__label" for="password">密码<span class="req">*</span></label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="请输入密码" required>
            <button class="input-group__btn" type="button" data-toggle-pwd="password">显示</button>
          </div>
        </div>

        <div class="row-between">
          <label class="checkbox">
                        <input type="checkbox" id="remember">
            <span>记住登录状态（7 天，勾选后 200 天）</span>
          </label>
          <a class="text-sm" href="forgot.html">忘记密码？</a>
        </div>

        <button class="btn btn--block" type="submit" id="submitBtn">
          <span class="btn__spinner"></span>
          <span>登 录</span>
        </button>
      </form>

      <div class="card__foot">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
  (function () {
    'use strict';

    var App = window.App;
    var $ = function (id) { return document.getElementById(id); };

    var alertEl  = $('alert');
    var form     = $('loginForm');
    var btn      = $('submitBtn');
    var accountEl= $('account');
    var passwordEl = $('password');
    var rememberEl = $('remember');

    /* 已登录直接回首页 */
    App.redirectIfLoggedIn();

    /* 从 URL 取 redirect 目标（仅允许同目录下的 html，防开放重定向） */
    function getRedirect() {
      var q = new URLSearchParams(location.search).get('redirect');
      if (!q) return App.PAGE.home;
      if (/^[A-Za-z0-9_\-]+\.html(\?[^#]*)?$/.test(q)) return q;
      return App.PAGE.home;
    }

    /* 密码显示切换 */
    document.querySelectorAll('[data-toggle-pwd]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.getAttribute('data-toggle-pwd'));
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.textContent = show ? '隐藏' : '显示';
      });
    });

    /* 注册跳转过来的提示 */
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('registered') === '1') {
        var acc = q.get('account') || '';
        if (acc) accountEl.value = acc;
        App.ui.showAlert(alertEl, 'success', '注册成功，请登录');
      }
    })();

    /* 输入清错 */
    [accountEl, passwordEl].forEach(function (el) {
      el.addEventListener('input', function () {
        App.ui.hideAlert(alertEl);
        el.removeAttribute('aria-invalid');
      });
    });

    /* 提交 */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      App.ui.hideAlert(alertEl);

      var account  = accountEl.value.trim();
      var password = passwordEl.value;

      if (!account) {
        App.ui.showAlert(alertEl, 'error', '请输入账号');
        accountEl.setAttribute('aria-invalid', 'true');
        accountEl.focus();
        return;
      }
      if (!password) {
        App.ui.showAlert(alertEl, 'error', '请输入密码');
        passwordEl.setAttribute('aria-invalid', 'true');
        passwordEl.focus();
        return;
      }

            var day = rememberEl.checked ? 200 : 7;

      App.ui.setLoading(btn, true);
      App.request('/api/account/login', {
        method: 'POST',
        auth: false,
        silent401: true,
        body: { account: account, password: password, day: day }
      }).then(function (r) {
        if (r.code === App.CODE.OK && r.data && r.data.token) {
          App.auth.setToken(r.data.token);
          App.auth.setUser({ id: r.data.id, username: r.data.username });
          App.ui.showAlert(alertEl, 'success', '登录成功，正在跳转…');
          setTimeout(function () { location.replace(getRedirect()); }, 350);
          return;
        }

        App.ui.setLoading(btn, false);
        var msg = r.message || '登录失败，请稍后重试';
        if (r.code === App.CODE.CREDENTIAL_BAD) msg = '账号或密码错误';
        else if (r.code === App.CODE.USER_DISABLED) msg = '账号已被禁用，请联系管理员';
        else if (r.code === App.CODE.USER_LOCKED) msg = '账号已被锁定，请稍后再试';
        else if (r.code === App.CODE.INVALID_PARAM) msg = msg || '请求参数有误';
        App.ui.showAlert(alertEl, 'error', msg);
      });
    });
  })();
  </script>
</body>
</html>
