<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册账号</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    padding: 36px 32px 28px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; color: #222; text-align: center; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  label .req { color: #e74c3c; }
  input {
    width: 100%; padding: 11px 13px;
    border: 1px solid #ddd; border-radius: 9px;
    font-size: 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
  .row { display: flex; gap: 10px; }
  .row > .field { flex: 1; }
  .hint { font-size: 12px; color: #999; margin-top: 5px; }
  button {
    width: 100%; padding: 12px; margin-top: 10px;
    border: none; border-radius: 9px; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 15px; font-weight: 600;
    transition: opacity .15s, transform .05s;
  }
  button:hover:not(:disabled) { opacity: .92; }
  button:active:not(:disabled) { transform: scale(.99); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    font-size: 13px; display: none; word-break: break-all;
  }
  .msg.ok  { display: block; background: #eafaf1; color: #1e874b; border: 1px solid #b7e6c8; }
  .msg.err { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f5c6c0; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>创建账号</h1>
    <div class="sub">带 <span style="color:#e74c3c">*</span> 为必填项</div>

    <div class="field">
      <label>用户名 <span class="req">*</span></label>
      <input name="username" id="username" placeholder="3~50 位字母 / 数字 / 下划线" required>
    </div>

    <div class="field">
      <label>密码 <span class="req">*</span></label>
      <input type="password" name="password" id="password" placeholder="6~72 位" required>
    </div>

    <div class="field">
      <label>确认密码 <span class="req">*</span></label>
      <input type="password" id="password2" placeholder="再次输入密码" required>
    </div>

    <div class="row">
      <div class="field">
        <label>邮箱</label>
        <input type="email" name="email" id="email" placeholder="用于找回密码">
      </div>
      <div class="field">
        <label>手机号</label>
        <input name="phone" id="phone" placeholder="用于找回密码">
      </div>
    </div>
    <div class="hint">邮箱和手机号至少填写一个，用于找回密码</div>

    <div class="field" style="margin-top:16px">
      <label>昵称</label>
      <input name="nickname" id="nickname" placeholder="不填则默认与用户名相同">
    </div>

    <button type="submit" id="btn">注 册</button>
    <div class="msg" id="msg"></div>
  </form>

<script>
(function () {
  // ==== 接口地址，按需修改 ====
  const API = '/api/account/register';

  const form    = document.getElementById('form');
  const btn     = document.getElementById('btn');
  const msgBox  = document.getElementById('msg');

  function show(type, text) {
    msgBox.className = 'msg ' + type;
    msgBox.textContent = text;
  }
  function hide() {
    msgBox.className = 'msg';
    msgBox.textContent = '';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hide();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const email    = document.getElementById('email').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const nickname = document.getElementById('nickname').value.trim();

    // ===== 前端校验（与后端规则保持一致） =====
    if (!/^[A-Za-z0-9_]{3,50}$/.test(username)) {
      return show('err', '用户名需为 3~50 位字母 / 数字 / 下划线');
    }
    if (password.length < 6 || password.length > 72) {
      return show('err', '密码长度需为 6~72 位');
    }
    if (password !== password2) {
      return show('err', '两次输入的密码不一致');
    }
    if (!email && !phone) {
      return show('err', '邮箱和手机号至少填写一个');
    }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return show('err', '邮箱格式不正确');
    }

    // ===== 请求 =====
    btn.disabled = true;
    btn.textContent = '提交中…';
    try {
      const resp = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          password: password,
          email: email,
          phone: phone,
          nickname: nickname
        })
      });

      let data = null;
      try { data = await resp.json(); } catch (_) { /* 非 JSON 响应 */ }

      if (data && data.code === 0) {
        show('ok', '注册成功！用户 ID：' + (data.data && data.data.id != null ? data.data.id : '-') +
                   '，用户名：' + username + '。现在可以去登录了。');
        form.reset();
      } else if (data && data.message) {
        show('err', data.message);
      } else {
        show('err', '注册失败（HTTP ' + resp.status + '）');
      }
    } catch (err) {
      show('err', '网络错误：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '注 册';
    }
  });
})();
</script>
</body>
</html>
