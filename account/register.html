<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>注册 · Go Web Server</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="page-center">
    <div class="brand">
      <div class="brand__mark">G</div>
      <div>
        <div class="brand__name">Go Web Server</div>
        <div class="brand__sub">Account Center</div>
      </div>
    </div>

    <div class="card">
      <div class="card__head">
        <h1 class="card__title">创建账号</h1>
        <p class="card__desc">邮箱和手机号至少填写一个</p>
      </div>

      <div class="alert alert--error" id="alert" role="alert" aria-live="polite"></div>

      <form class="form" id="registerForm" novalidate>
        <div class="field">
          <label class="field__label" for="username">用户名<span class="req">*</span></label>
          <input class="input" id="username" name="username" type="text"
                 autocomplete="username" placeholder="3~50 位字母、数字或下划线"
                 required autofocus>
          <div class="field__hint">仅支持 a-z A-Z 0-9 和 _</div>
        </div>

        <div class="field">
          <label class="field__label" for="password">密码<span class="req">*</span></label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="new-password" placeholder="6~72 位" required>
            <button class="input-group__btn" type="button" data-toggle-pwd="password">显示</button>
          </div>
          <div class="strength" id="strength" data-level="0">
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
            <div class="strength__bar"></div>
          </div>
          <div class="strength__text" id="strengthText">建议混合字母、数字与符号</div>
        </div>

        <div class="field">
          <label class="field__label" for="confirm">确认密码<span class="req">*</span></label>
          <div class="input-group">
            <input class="input" id="confirm" name="confirm" type="password"
                   autocomplete="new-password" placeholder="再次输入密码" required>
            <button class="input-group__btn" type="button" data-toggle-pwd="confirm">显示</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="email">邮箱</label>
          <input class="input" id="email" name="email" type="email"
                 autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label class="field__label" for="phone">手机号</label>
          <input class="input" id="phone" name="phone" type="tel"
                 autocomplete="tel" placeholder="选填，纯数字 6~20 位">
        </div>

        <div class="field">
          <label class="field__label" for="nickname">昵称</label>
          <input class="input" id="nickname" name="nickname" type="text"
                 autocomplete="nickname" placeholder="留空则默认与用户名相同">
        </div>

        <label class="checkbox">
          <input type="checkbox" id="agree">
          <span>我已阅读并同意服务条款与隐私政策</span>
        </label>

        <button class="btn btn--block" type="submit" id="submitBtn">
          <span class="btn__spinner"></span>
          <span>注 册</span>
        </button>
      </form>

      <div class="card__foot">
        已经有账号？<a href="login.html">返回登录</a>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
  (function () {
    'use strict';

    var App = window.App;
    var $ = function (id) { return document.getElementById(id); };

    var alertEl  = $('alert');
    var form     = $('registerForm');
    var btn      = $('submitBtn');
    var username = $('username');
    var password = $('password');
    var confirm  = $('confirm');
    var email    = $('email');
    var phone    = $('phone');
    var nickname = $('nickname');
    var agree    = $('agree');
    var strengthEl = $('strength');
    var strengthTx = $('strengthText');

    App.redirectIfLoggedIn();

    /* 密码显示切换 */
    document.querySelectorAll('[data-toggle-pwd]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.getAttribute('data-toggle-pwd'));
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.textContent = show ? '隐藏' : '显示';
      });
    });

    /* 输入清错 */
    [username, password, confirm, email, phone, nickname].forEach(function (el) {
      el.addEventListener('input', function () {
        App.ui.hideAlert(alertEl);
        el.removeAttribute('aria-invalid');
      });
    });

    /* 密码强度 */
    var STRENGTH_TEXT = [
      '建议混合字母、数字与符号',
      '强度：弱',
      '强度：一般',
      '强度：较强',
      '强度：很强'
    ];
    password.addEventListener('input', function () {
      var lv = App.validate.strength(password.value);
      strengthEl.setAttribute('data-level', String(lv));
      strengthTx.textContent = STRENGTH_TEXT[lv];
    });

    function fail(el, msg) {
      App.ui.showAlert(alertEl, 'error', msg);
      el.setAttribute('aria-invalid', 'true');
      el.focus();
    }

    /* 提交 */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      App.ui.hideAlert(alertEl);

      var vUser  = username.value.trim();
      var vPwd   = password.value;
      var vCfm   = confirm.value;
      var vMail  = email.value.trim();
      var vPhone = phone.value.trim();
      var vNick  = nickname.value.trim();

      var err = App.validate.username(vUser);
      if (err) { fail(username, err); return; }

      err = App.validate.password(vPwd);
      if (err) { fail(password, err); return; }

      if (vPwd !== vCfm) { fail(confirm, '两次输入的密码不一致'); return; }

      err = App.validate.email(vMail);
      if (err) { fail(email, err); return; }

      err = App.validate.phone(vPhone);
      if (err) { fail(phone, err); return; }

      if (!vMail && !vPhone) {
        App.ui.showAlert(alertEl, 'error', '邮箱和手机号至少填写一个');
        email.focus();
        return;
      }

      if (!agree.checked) {
        App.ui.showAlert(alertEl, 'error', '请先阅读并同意服务条款');
        return;
      }

      App.ui.setLoading(btn, true);
      App.request('/api/account/register', {
        method: 'POST',
        auth: false,
        body: {
          username: vUser,
          password: vPwd,
          email: vMail,
          phone: vPhone,
          nickname: vNick
        }
      }).then(function (r) {
        if (r.code === App.CODE.OK) {
          App.ui.setLoading(btn, false);
          App.ui.showAlert(alertEl, 'success', '注册成功，正在跳转到登录页…');
          setTimeout(function () {
            location.replace('login.html?registered=1&account=' + encodeURIComponent(vUser));
          }, 700);
          return;
        }

        App.ui.setLoading(btn, false);
        var msg = r.message || '注册失败，请稍后重试';
        if (r.code === App.CODE.USER_EXISTS) msg = '用户名 / 邮箱 / 手机号已被占用';
        else if (r.code === App.CODE.INVALID_PARAM) msg = msg || '请求参数有误';
        App.ui.showAlert(alertEl, 'error', msg);
      });
    });
  })();
  </script>
</body>
</html>
