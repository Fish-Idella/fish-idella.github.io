<template id="settings">
    <style>
        .settings {
            place-content: center;
            place-items: center;
        }

        .settings .dialog-box {
            background-color: var(--background-box);
            width: 900px;
            height: 600px;
        }

        .menu-list {
            overflow-y: auto;
            margin: 0;
            padding: 0;
            max-width: 50%;
            min-width: 300px;
            /* height: 100%; */
            background-color: var(--background-menu-list);
            font-weight: bolder;
        }

        .menu-list>li {
            overflow: hidden;
            width: 100%;
            height: 3rem;
            font-size: 1.2rem;
            line-height: 3rem;
            cursor: pointer;
        }

        .menu-list>li:hover {
            background-color: var(--background-menu-list-hover);
        }

        .menu-list>li>.selected {
            width: 4px;
        }

        .menu-list>li.light>.selected {
            margin: .5rem 0;
            background-color: var(--background-switch-select);
        }

        .menu-list>li>.icon {
            width: 3rem;
            text-align: center;
        }

        .template-content>.template-layer-host {
            position: relative;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
    </style>
    <div class="settings view flex-vertical hide">
        <div class="flex-vertical dialog-box">
            <div class="menu-title">
                <div class="title">设置</div>
            </div>
            <div class="flex-horizontal fill">
                <ul class="menu-list">
                    <li class="flex-horizontal">
                        <span class="selected"></span>
                        <span class="icon">⚙️</span>
                        <span class="text">通用设置</span>
                    </li>
                </ul>
                <div class="fill template-content scroll-y"></div>
            </div>
        </div>
    </div>
</template>

<template id="switch">

    <style>
        .custom-switch {
            position: relative;
            margin: 5px;
            width: 44px;
            height: 22px;
            border-radius: 11px;
            overflow: hidden;
        }

        .toogle {
            background-color: #c9d6ff;
        }

        .toogle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            top: 1px;
            left: 1px;
            border-radius: 10px;
            transition: left 100ms;
        }

        .custom-switch>input[type=checkbox]:checked+.toogle {
            background-color: #3f82ff;
        }

        .custom-switch>input[type=checkbox]:checked+.toogle::after {
            left: 23px;
        }
    </style>
    <label class="flex-horizontal">
        <div class="fill">
            <div class="text"></div>
            <div class="long_text"></div>
        </div>
        <div class="custom-switch">
            <input type="checkbox">
            <div class="view toogle"></div>
        </div>
    </label>
    <script>
        return function layer(root, MainUI, options) {
            const a = root.querySelector('input[type=checkbox]');
            a.dataset.psid = options.psid;
            a.checked = MainUI[options.psid];
        }
    </script>

</template>

<template id="file">

    <style></style>
    <div></div>
    <script>
        return function exec_file(root, MainUI, options) {
            // 将当前项目中的 'button' 组件实例加入第一个元素中
            PuSet.get('button', this.namespace).init(root.firstElementChild, true, function (root, view) {
                // 执行 'button' 组件的 exec_button() 方法
                view.exec(root, MainUI, options);
            });
        }
    </script>

</template>
