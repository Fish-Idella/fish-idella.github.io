            line-height: 1.45;
            color: var(--color-text, #1f2328);
        }

        .switch .long_text {

            font-size: .78rem;
            line-height: 1.45;
            color: var(--color-long-text, #8a8f98);
        }

        /* ---- 开关本体 ---- */
        .custom-switch {
            position: relative;
            flex-shrink: 0;
            width: 44px;
            height: 24px;
            border-radius: 999px;
            overflow: hidden;
        }

        .custom-switch>input[type="checkbox"] {
            position: absolute;
            inset: 0;
            margin: 0;
            opacity: 0;
            z-index: 1;
            cursor: pointer;
        }

        .toogle {
            position: absolute;
            inset: 0;
            background-color: var(--background-switch, #ccd4e6);
            transition: background-color 200ms ease;
        }

        .toogle::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
            transition: left 200ms cubic-bezier(.4, 0, .2, 1);
        }

        .custom-switch>input[type="checkbox"]:checked+.toogle {
            background-color: var(--ps-accent, var(--background-switch-select, #3f82ff));
        }

        .custom-switch>input[type="checkbox"]:checked+.toogle::after {
            left: 23px;
        }

        .custom-switch>input[type="checkbox"]:focus-visible+.toogle {
            box-shadow: 0 0 0 3px rgba(63, 130, 255, .35);
        }
    </style>
    <label class="switch flex-horizontal">

            <div class="text"></div>
            <div class="long_text"></div>
        </div>

    <script>
        return function layer(root, settings, options) {
            const a = root.querySelector('input[type=checkbox]');
            a.dataset.psid = options.psid;

            const b_root = PuSet.get('button', this.namespace).init(root.querySelector('.wdiget-area'), true);

            button.textContent = options.value;

            });

<template id="object-list">
    <style>
        .object-list {
            box-sizing: border-box;
        }

        .object-list .list {
            display: flex;
            flex-direction: column;
            gap: .375rem;
            margin: 0;
            padding: 0;
        }

        .object-list li {
            display: flex;
            align-items: center;
            gap: .5rem;
            order: attr(--order);
            list-style: none;
            height: 2.25rem;
            padding: 0 .75rem;
            box-sizing: border-box;
            font-size: .875rem;
            color: var(--color-text, #1f2328);
            cursor: pointer;
            border-radius: 8px;
            background-color: var(--background-button, rgba(0, 0, 0, .04));
            transition: background-color 150ms ease, box-shadow 150ms ease, transform 100ms ease;
        }

        .object-list li:hover {
            background-color: var(--background-button-hover, rgba(0, 0, 0, .08));
        }

        .object-list li:active {
            transform: scale(.995);
        }

        .object-list li::before {
            display: inline-block;
            box-sizing: border-box;
            content: attr(data-order);
            width: 1.4rem;
            height: 1.4rem;
            flex-shrink: 0;
            border-radius: 50%;
            background-color: var(--ps-accent, var(--background-switch-select, #3f82ff));
            color: #fff;
            font-size: .75rem;
            font-weight: 700;
            line-height: 1.4rem;
            text-align: center;
            transition: background-color 150ms ease, border-color 150ms ease;
        }

        /* 未选中项：空心虚线圆圈 */
        .object-list li[data-order=" "]::before {
            background-color: transparent;
            border: 1.5px dashed var(--border-color, rgba(0, 0, 0, .22));
            color: transparent;
        }
    </style>
    <div class="object-list">
        <div class="wdiget-area"></div>
        <ul class="list flex-vertical">
            <li class="flex-horizontal"></li>
        </ul>
    </div>
    <script>
        return function exec_object_list(root, settings, options) {
            // 将当前项目中的 'button' 组件实例加入第一个元素中
            PuSet.get('button', this.namespace).init(root.querySelector('.wdiget-area'), true, function (root, view) {
                // 执行 'button' 组件的 exec_button() 方法
                view.exec(root, settings, options);
            });
            const selected = settings[options.selected];
            const vm = PuSet.mvvm({
                target: root.querySelector('ul.list'),
                data: Object.entries(settings[options.list]),
                selector: 'li',
                layout(li, [key, value], index) {
                    li.dataset.key = key;
                    const order = selected.indexOf(key);
                    li.style.setProperty('order', order >= 0 ? order : this.data.length);
                    li.dataset.order = order >= 0 ? 1 + order : ' '
                    li.textContent = value.title;
                }
            }).on('click', function (event, [key, value]) {
                const order = selected.indexOf(key);
                if (order >= 0) {
                    selected.splice(order, 1)
                    this.style.setProperty('order', vm.data.length);
                    this.dataset.order = ' '
                } else {
                    if (selected.length >= options.max) return;
                    const i = selected.push(key)
                    this.style.setProperty('order', i);
                    this.dataset.order = i
                }
                MainUI.onchange(options.selected, '', selected)
            }).on('contextmenu', function (event, [key, value], index) {
                event.preventDefault();
                MainUI.openLinkManager(vm, index);
            });
        }
    </script>
</template>

<template id="image-list">
    <style>
        .image-list {
            box-sizing: border-box;
        }

        .image-list .list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: .75rem;
            margin-top: .5rem;
            padding: .625rem 1rem;
        }

        .image-list .video-box {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
            background-color: var(--background-button, rgba(0, 0, 0, .06));
            transition: transform 150ms ease, box-shadow 150ms ease;
        }

        .image-list .video-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
        }

        .image-list .video-box:active {
            transform: translateY(0) scale(.985);
        }

        .image-list video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
    <div class="image-list">
        <div class="wdiget-area"></div>
        <div class="list grid-horizontal">
            <div class="video-box">
                <video class="view" muted loop></video>
            </div>
        </div>
    </div>
    <script>
        return function layer(root, settings, options) {
            // 将当前项目中的 'file' 组件实例加入第一个元素中
            PuSet.get('file', this.namespace).init(root.querySelector('.wdiget-area'), true, function (root, view) {
                // 执行 'file' 组件的 exec_file() 方法
                view.exec(root, settings, options);
            });
            PuSet.mvvm({
                target: root.querySelector('div.list'),
                data: options.list,
                selector: '.video-box',
                layout: PuSet.paired()
                    .prop('s', 'video', 'src')
                    .prop('p', 'video', 'poster')
                    .build()
            }).on('click', function (event, value) {
                MainUI.onchange('boolean_image_wallpaper', value.t, value.s)
            }).on('pointerenter', function (event, value) {
                if (!value.t.startsWith('video')) return;
                /** @type {HTMLMediaElement} */
                const video = this.querySelector('video');
                if ((video.ended || video.paused)) {
                    video.play()
                }
            }).on('pointerleave pointercancel', function (event, value) {
                if (!value.t.startsWith('video')) return;
                /** @type {HTMLMediaElement} */
                const video = this.querySelector('video');
                if (!(video.ended || video.paused)) {
                    video.pause()
                }
            });
        }
    </script>
</template>
